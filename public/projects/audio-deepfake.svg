<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Robust audio deepfake detection</title>
  <desc id="desc">A waveform and spectrogram flow into a binary authenticity detector.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" rx="28" fill="url(#bg)"/>
  <g opacity=".2" stroke="#93c5fd">
    <path d="M40 70h560M40 120h560M40 170h560M40 220h560M40 270h560M40 320h560"/>
    <path d="M80 45v310M140 45v310M200 45v310M260 45v310M320 45v310M380 45v310M440 45v310M500 45v310M560 45v310"/>
  </g>

  <g opacity=".75" fill="url(#spec)">
    <rect x="54" y="260" width="18" height="54" rx="8"/>
    <rect x="82" y="214" width="18" height="100" rx="8"/>
    <rect x="110" y="166" width="18" height="148" rx="8"/>
    <rect x="138" y="236" width="18" height="78" rx="8"/>
    <rect x="166" y="116" width="18" height="198" rx="8"/>
    <rect x="194" y="188" width="18" height="126" rx="8"/>
    <rect x="222" y="78" width="18" height="236" rx="8"/>
    <rect x="250" y="146" width="18" height="168" rx="8"/>
    <rect x="278" y="100" width="18" height="214" rx="8"/>
    <rect x="306" y="210" width="18" height="104" rx="8"/>
  </g>

  <path d="M44 188c24 0 24-48 48-48s24 96 48 96 24-139 48-139 24 182 48 182 24-116 48-116 24 56 48 56 24-31 48-31" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <path d="M356 200h54" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="m399 187 15 13-15 13" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(438 92)">
    <rect width="148" height="216" rx="30" fill="#fff" opacity=".96"/>
    <circle cx="74" cy="80" r="40" fill="#dcfce7"/>
    <path d="m54 80 14 14 27-31" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="35" y="139" width="78" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="48" y="162" width="52" height="10" rx="5" fill="#e2e8f0"/>
  </g>
</svg>
