<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Making CloverLeaf faster</title>
  <desc id="desc">A benchmark chart shows shorter optimized runtimes and a four point one nine times speedup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14532d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="640" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="570" cy="344" r="118" fill="#dcfce7" opacity=".7"/>
  <circle cx="72" cy="66" r="76" fill="#fef3c7" opacity=".8"/>

  <g transform="translate(62 70)" filter="url(#shadow)">
    <rect width="360" height="260" rx="24" fill="#fff"/>
    <path d="M54 30v190h270" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <g font-family="system-ui, sans-serif" font-size="15" fill="#64748b">
      <text x="54" y="244">Baseline</text>
      <text x="54" y="196">Compiler</text>
      <text x="54" y="148">MPI</text>
      <text x="54" y="100">NUMA</text>
    </g>
    <rect x="135" y="225" width="178" height="18" rx="9" fill="#cbd5e1" transform="translate(0 -24)"/>
    <rect x="135" y="153" width="130" height="18" rx="9" fill="#86efac"/>
    <rect x="135" y="105" width="88" height="18" rx="9" fill="#4ade80"/>
    <rect x="135" y="57" width="43" height="18" rx="9" fill="url(#fast)"/>
  </g>

  <g transform="translate(456 112)" filter="url(#shadow)">
    <circle cx="70" cy="70" r="70" fill="#166534"/>
    <text x="70" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#fff">4.19×</text>
    <text x="70" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#bbf7d0">FASTER</text>
  </g>

  <path d="M462 282c18-42 36-56 66-58 23-2 40 8 54 28" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
  <path d="m570 239 16 15-21 8" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
